[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fresh-lang"
version = "0.1.0"
description = "Fresh Programming Language - Compiler & Bytecode VM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Vihaan" }
]
keywords = [
    "compiler",
    "programming-language",
    "bytecode-vm",
    "interpreter",
    "transpiler",
    "fresh",
    "type-checker",
    "garbage-collection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/CodeClosed/fresh-lang"
Repository = "https://github.com/CodeClosed/fresh-lang.git"
Issues = "https://github.com/CodeClosed/fresh-lang/issues"

[project.scripts]
fresh = "fresh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/fresh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/fresh"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
